<body>

<div class="container">

  <!-- Header (կարող ես նույնը օգտագործել ինչ Home-ում) -->

    <div class="brand">
      <div class="logo">HL</div>
      <div class="brand-title">
        Էլեկտրոնային դասընթացների նախագծման տեխնալոգիաներ
      </div>
    </div>

    <nav>
      <a href="index.html">Գլխավոր</a>
      <a href="themes.html">Ուսումնական նյութեր</a>
    <a href="contact.html">Կապ մեզ հետ</a>
        <a href="admin.html">Ադմին</a>
    </nav>
  </header>

  <!-- Main -->
  <main>

    <section class="contact-hero">
      <h1>Կապ մեզ հետ</h1>
      <p>
        Եթե ունեք հարցեր, առաջարկներ կամ խնդիրներ՝
        հաճույքով կպատասխանենք Ձեր հաղորդագրությանը։
      </p>
    </section>

    <section class="contact-section">
<!-- 
      <div class="contact-info">
        <h2>Մեր տվյալները</h2>
        <p><strong>📧 Էլ․ փոստ՝</strong> info@elearning.am</p>
        <p><strong>📞 Հեռախոս՝</strong> +374 XX XXX XXX</p>
        <p><strong>📍 Հասցե՝</strong> Երևան, Հայաստան</p>

        <div class="contact-note">
          💡 Պատասխանում ենք հնարավորինս արագ՝ աշխատանքային օրերին
        </div>
      </div> -->

      <div class="contact-form">
        <h2>Ուղարկել հաղորդագրություն</h2>

        <form>
          <div class="form-group">
            <label for="name">Անուն</label>
            <input type="text" id="name" placeholder="Ձեր անունը" required>
          </div>

          <div class="form-group">
            <label for="email">Էլ․ փոստ</label>
            <input type="email" id="email" placeholder="example@mail.com" required>
          </div>

          <div class="form-group">
            <label for="subject">Թեմա</label>
            <input type="text" id="subject" placeholder="Հաղորդագրության թեման">
          </div>

          <div class="form-group">
            <label for="message">Հաղորդագրություն</label>
            <textarea id="message" rows="5" placeholder="Գրեք Ձեր հաղորդագրությունը..." required></textarea>
          </div>

          <button type="submit" class="btn primary large-btn">
            Ուղարկել
          </button>
        </form>
      </div>

    </section>

  </main>

  <footer>
    © Էլեկտրոնային ուսուցման հարթակ
  </footer>

</div>

</body>
</html>
